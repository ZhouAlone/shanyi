name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # 手动触发测试构建

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: uv run python tests.py

      - name: Lint
        run: uv run pyflakes *.py

      - name: Build
        run: uv run pyinstaller shanyi.spec --noconfirm

      - name: Smoke test (app starts and registers hotkeys)
        run: |
          Start-Process -FilePath "dist\Shanyi\Shanyi.exe"
          Start-Sleep -Seconds 6
          $p = Get-Process | Where-Object { $_.Path -like '*Shanyi*' }
          if (-not $p) { throw "Shanyi.exe failed to start" }
          Write-Output "Shanyi.exe is running (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: Zip release
        run: Compress-Archive -Path dist\Shanyi -DestinationPath Shanyi-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shanyi-win64
          path: Shanyi-win64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Shanyi-win64.zip
